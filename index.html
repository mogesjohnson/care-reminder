<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#146c43">
  <meta name="description" content="Medications, daily doses and appointments, stored on this device.">
  <title>Care Reminder</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="lock" class="lock">
    <form id="lockForm" class="lock-box" autocomplete="off">
      <img src="icons/icon-192.png" alt="" width="96" height="96">
      <h1>Care Reminder</h1>
      <p id="lockHint">Enter your PIN to open.</p>
      <label class="field"><span id="pinLabel">PIN</span>
        <input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" required></label>
      <label class="field" id="pin2Wrap" hidden>Confirm PIN
        <input id="pin2" type="password" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8"></label>
      <p id="lockError" class="error" role="alert"></p>
      <button class="btn primary block" type="submit" id="lockSubmit">Unlock</button>
      <p class="note">This PIN is a <strong>local lock on this device only</strong>, not real security. There is no server:
        your data is stored unencrypted in this browser, and anyone with access to the phone's browser data could read it.</p>
      <button type="button" class="link-btn" id="resetBtn">Forgot PIN? Reset app (erases all data)</button>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <img src="icons/icon-192.png" alt="" width="36" height="36">
      <h1 id="title">Today</h1>
      <button id="lockBtn" class="icon-btn" type="button" aria-label="Lock app">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h1zm2 0h6V7a3 3 0 0 0-6 0v3z"/></svg>
      </button>
    </header>

    <main id="main">
      <section id="tab-today" class="panel" data-title="Today's pills"></section>
      <section id="tab-current" class="panel" data-title="Current meds" hidden></section>
      <section id="tab-schedule" class="panel" data-title="Schedule" hidden></section>
      <section id="tab-meds" class="panel" data-title="Meds &amp; supplements" hidden></section>
      <section id="tab-settings" class="panel" data-title="Settings" hidden></section>
    </main>

    <nav class="tabbar" aria-label="Sections">
      <button type="button" data-tab="today" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>Today</button>
      <button type="button" data-tab="current">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.2 13.4a5 5 0 0 1 0-7.1l2.1-2.1a5 5 0 0 1 7.1 0l6.4 6.4a5 5 0 0 1 0 7.1l-2.1 2.1a5 5 0 0 1-7.1 0zm1.4-5.7a3 3 0 0 0 0 4.3l3 3 6.4-6.4-3-3a3 3 0 0 0-4.3 0z"/></svg>Current</button>
      <button type="button" data-tab="schedule">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h2v2h6V2h2v2h3a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3zm12 8H5v9h14zM5 8h14V6H5z"/></svg>Schedule</button>
      <button type="button" data-tab="meds">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h16v2H4z"/></svg>Meds</button>
      <button type="button" data-tab="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 1.7-1l2.4 1 2-3.4zM13 15a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>Settings</button>
    </nav>
  </div>

  <dialog id="editor" aria-labelledby="editorTitle">
    <form id="editorForm" method="dialog">
      <h2 id="editorTitle"></h2>
      <div id="editorFields"></div>
      <div class="row end">
        <button type="button" class="btn secondary" id="editorCancel">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
